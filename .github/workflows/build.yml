name: Build
env:
  PYTHON_VERSION: '3.11'
on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      ref_name:
        description: 'Version/tag name (e.g. v1.0.0)'
        required: true
permissions:
  # Required for the release step to create the draft and upload assets.
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: 'requirements.txt'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Install PyInstaller
        run: pip install pyinstaller
      - name: Install Inno Setup
        run: choco install innosetup --yes
      - name: Build executable
        run: |
          python -m PyInstaller --noconsole --onedir --name "vry" --add-data "vry-gui.html;." --add-data "docs;docs" --add-data "assets;assets" --add-data "src;src" --add-data "updatescript.bat;." --icon=assets/Logo.ico --collect-all webview --collect-all websocket_server launcher.py
      - name: Resolve version
        id: version
        run: |
          $ver = if ("${{ github.event.inputs.ref_name }}" -ne "") { "${{ github.event.inputs.ref_name }}" } else { "${{ github.ref_name }}" }
          echo "tag=$ver" >> $env:GITHUB_OUTPUT
          $notes = ".github/RELEASE_$ver.md"
          if (-not (Test-Path $notes)) { $notes = ".github/RELEASE_TEMPLATE.MD" }
          echo "notes=$notes" >> $env:GITHUB_OUTPUT
      - name: Compile Inno Setup installer
        run: iscc installer.iss /DMyAppVersion=${{ steps.version.outputs.tag }}
      - name: Zip portable build
        run: Compress-Archive -Path dist\vry\* -DestinationPath dist\vry-${{ steps.version.outputs.tag }}-portable.zip
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Version ${{ steps.version.outputs.tag }}
          files: |
            dist/vry-${{ steps.version.outputs.tag }}-setup.exe
            dist/vry-${{ steps.version.outputs.tag }}-portable.zip
          body_path: ${{ steps.version.outputs.notes }}
          draft: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}